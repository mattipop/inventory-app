{% extends 'base.html' %}
{% block content %}
<h2>Add Sale</h2>
<form method="POST">
  <label>Select Product:</label><br>
  <select name="item_id" required>
    {% for id, name, sort, stock in items %}
    <option value="{{ id }}">{{ name }} - {{ sort }} (Stock: {{ stock }})</option>
    {% endfor %}
  </select><br><br>

  <label>Quantity Sold:</label><br>
  <input type="number" name="quantity" required><br><br>

  <label>Sale Price per Unit:</label><br>
  <input type="number" step="0.01" name="sale_price" required><br><br>

  <input type="submit" value="Add Sale">
</form>
{% endblock %}
